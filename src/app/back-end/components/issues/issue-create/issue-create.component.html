<div class="card">
  <div class="card-header">
    <h5 class="text-white">{{ isEdit ? "Update Issue" : "Add Issue" }}</h5>
  </div>

  <form #issueForm="ngForm" (ngSubmit)="saveIssue(issueForm)"
    enctype="multipart/form-data" novalidate>
    <div class="card-body">
      <div *ngIf="isMessage" class="alert alert-danger">
        {{ message }}
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label>Category *</label>
          <select
            class="form-control"
            name="category_id"
            [(ngModel)]="issue.category_id"
            #category_id="ngModel"
            required>
            <option value>-- Select --</option>
            <option *ngFor="let r of categories" [value]="r.id">
              {{ r.name }}
            </option>
          </select>
          <small class="text-danger"
            *ngIf="issueForm.submitted && category_id.invalid">
            Category is required
          </small>
        </div>

        <div class="col-6 mb-3">
          <label>Issue Title *</label>
          <input
            type="text"
            class="form-control"
            name="issue_title"
            [(ngModel)]="issue.issue_title"
            #issue_title="ngModel"
            required />
          <small class="text-danger"
            *ngIf="issueForm.submitted && issue_title.invalid">
            Issue Title is required
          </small>
        </div>
      </div>

      <div class="row">
        <div class="col-12 mb-3">
          <label>Issue Description *</label>
          <textarea
            class="form-control"
            name="issue_description"
            [(ngModel)]="issue.issue_description"
            #issue_description="ngModel"
            rows="4"
            required></textarea>
          <small class="text-danger"
            *ngIf="issueForm.submitted && issue_description.invalid">
            Issue Description is required
          </small>
        </div>
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label>State *</label>
          <select
            class="form-control"
            name="state_id"
            [(ngModel)]="issue.state_id"
            #state_id="ngModel"
            (change)="loadDistricts(issue.state_id)"
            required>
            <option value>-- Select --</option>
            <option *ngFor="let s of states" [value]="s.id">
              {{ s.name }}
            </option>
          </select>
          <small class="text-danger"
            *ngIf="issueForm.submitted && state_id.invalid">
            State is required
          </small>
        </div>

        <div class="col-6 mb-3">
          <label>District *</label>
          <select
            class="form-control"
            name="district_id"
            [(ngModel)]="issue.district_id"
            #district_id="ngModel"
            (change)="loadAssemblies(issue.district_id)"
            required>
            <option value>-- Select --</option>
            <option *ngFor="let d of districts" [value]="d.id">
              {{ d.name }}
            </option>
          </select>
          <small class="text-danger"
            *ngIf="issueForm.submitted && district_id.invalid">
            District is required
          </small>
        </div>
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label>Assembly *</label>
          <select
            class="form-control"
            name="assembly_id"
            [(ngModel)]="issue.assembly_id"
            #assembly_id="ngModel"
            (change)="loadMandals(issue.assembly_id)"
            required>
            <option value>-- Select --</option>
            <option *ngFor="let a of assemblies" [value]="a.id">
              {{ a.name }}
            </option>
          </select>
          <small class="text-danger"
            *ngIf="issueForm.submitted && assembly_id.invalid">
            Assembly is required
          </small>
        </div>

        <div class="col-6 mb-3">
          <label>Mandal</label>
          <select
            class="form-control"
            name="mandal_id"
            [(ngModel)]="issue.mandal_id"
            #mandal_id="ngModel"
            (change)="loadVillages(issue.mandal_id)">
            <option value>-- Select --</option>
            <option *ngFor="let m of mandals" [value]="m.id">
              {{ m.name }}
            </option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label>Village</label>
          <select
            class="form-control"
            name="village_id"
            [(ngModel)]="issue.village_id"
            #village_id="ngModel"
            (change)="loadRepresentatives()">
            <option value>-- Select --</option>
            <option *ngFor="let v of villages" [value]="v.id">
              {{ v.name }}
            </option>
          </select>
        </div>

        <div class="col-6 mb-3">
          <label>Tag Representative *</label>
          <select
            class="form-control"
            name="assigned_to"
            [(ngModel)]="issue.assigned_to"
            #assigned_to="ngModel"
            required>
            <option value>-- Select --</option>
            <option *ngFor="let representative of representatives"
              [value]="representative.id">
              {{ representative.full_name }} - {{ representative.role }}
            </option>
          </select>
          <small class="text-danger"
            *ngIf="issueForm.submitted && assigned_to.invalid">
            Tag Representative is required
          </small>
        </div>
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label>Issue Pictures *</label>
          <input
            type="file"
            #fileInput
            class="form-control"
            accept="image/*"
            multiple
            (change)="onFileChange($event)" />

          <small
            class="text-danger"
            *ngIf="issueForm.submitted && imagePreviews.length === 0 && existingImages.length === 0">
            At least one issue picture is required
          </small>

          <div *ngIf="existingImages.length || imagePreviews.length"
            class="mt-2">
            <div class="d-flex flex-wrap align-items-start gap-3">

              <!-- Existing Images -->
              <div *ngFor="let img of existingImages" class="text-center">
                <img
                  [src]="img"
                  class="img-thumbnail"
                  style="width:120px; height:120px; object-fit:cover;">
              </div>

              <!-- Uploaded Images -->
              <div *ngFor="let img of imagePreviews; let i = index"
                class="text-center">
                <img
                  [src]="img"
                  class="img-thumbnail"
                  style="width:120px; height:120px; object-fit:cover;">

                <button
                  type="button"
                  class="btn btn-danger btn-sm mt-2 w-100"
                  (click)="removeSelectedImage(i)">
                  Remove
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer d-flex align-items-center">
      <button
        type="submit"
        class="btn btn-primary mr-2"
        [disabled]="isSaving">

        <span *ngIf="isSaving">
          <i class="fas fa-spinner fa-spin mr-2"></i>
          {{ isEdit ? "Updating..." : "Saving..." }}
        </span>

        <span *ngIf="!isSaving">
          {{ isEdit ? "Update" : "Save" }}
        </span>

      </button>

      <button type="button" class="btn btn-dark" (click)="handleBackBtn()">
        Back
      </button>
    </div>
  </form>
</div>
