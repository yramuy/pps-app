<div class="card">
    <div class="card-header">
        <h5 class="text-white">About Us</h5>
    </div>

    <form
        #aboutForm="ngForm"
        (ngSubmit)="saveAboutUs(aboutForm)"
        enctype="multipart/form-data"
        novalidate>

        <div class="card-body">

            <div *ngIf="isMessage" class="alert alert-danger">
                {{ message }}
            </div>

            <div class="row">

                <!-- Title -->
                <div class="col-md-6 mb-3">
                    <label>Title <span class="text-danger">*</span></label>
                    <input
                        type="text"
                        class="form-control"
                        name="title"
                        [(ngModel)]="about.title"
                        #title="ngModel"
                        required>

                    <small
                        class="text-danger"
                        *ngIf="aboutForm.submitted && title.invalid">
                        Title is required
                    </small>
                </div>

                <!-- Subtitle -->
                <div class="col-md-6 mb-3">
                    <label>Sub Title</label>

                    <input
                        type="text"
                        class="form-control"
                        name="sub_title"
                        [(ngModel)]="about.sub_title">
                </div>

            </div>

            <!-- Description -->
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label>
                        Description <span class="text-danger">*</span>
                    </label>

                    <ckeditor
                        name="description"
                        [editor]="Editor"
                        [(ngModel)]="about.description"
                        [config]="editorConfig"
                        #description="ngModel"
                        required>
                    </ckeditor>

                    <small
                        class="text-danger"
                        *ngIf="aboutForm.submitted && description.invalid">
                        Description is required
                    </small>
                </div>
            </div>

            <!-- Vision -->
            <!-- <div class="row"> -->
            <!-- <div class="col-md-6 mb-3">
                    <label>Vision</label>

                    <textarea
                        rows="5"
                        class="form-control"
                        name="vision"
                        [(ngModel)]="about.vision"></textarea>
                </div> -->

            <!-- Mission -->
            <!-- <div class="col-md-6 mb-3">
                    <label>Mission</label>

                    <textarea
                        rows="5"
                        class="form-control"
                        name="mission"
                        [(ngModel)]="about.mission"></textarea>
                </div> -->
            <!-- </div> -->

            <!-- Chairman Message -->
            <!-- <div class="row">
                <div class="col-md-12 mb-3">
                    <label>Chairman Message</label>

                    <textarea
                        rows="6"
                        class="form-control"
                        name="chairman_message"
                        [(ngModel)]="about.chairman_message"></textarea>
                </div>
            </div> -->

            <!-- Image -->
            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>About Image</label>

                    <input
                        #fileInput
                        type="file"
                        class="form-control"
                        accept="image/*"
                        (change)="onFileChange($event)">

                    <div *ngIf="imagePreview" class="mt-3">
                        <img
                            [src]="imagePreview"
                            alt="About Us"
                            class="img-thumbnail"
                            style="width: 250px; height: 180px; object-fit: cover;" />
                    </div>

                </div>

            </div>

        </div>

        <div class="card-footer">

            <button
                type="submit"
                class="btn btn-primary mr-2"
                [disabled]="loading">

                <span *ngIf="loading">Saving...</span>
                <span *ngIf="!loading">
                    {{ about.id ? 'Update' : 'Save' }}
                </span>
            </button>

            <button
                type="button"
                class="btn btn-dark"
                (click)="handleBackBtn()">
                Back
            </button>

        </div>

    </form>
</div>
