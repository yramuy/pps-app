<div class="card">

    <!-- =========================
         Header
    ========================== -->
    <div class="card-header">
        <h5 class="text-white">
            About Us
        </h5>
    </div>


    <!-- =========================
         Form
    ========================== -->
    <form
        #aboutForm="ngForm"
        (ngSubmit)="saveAboutUs(aboutForm)"
        enctype="multipart/form-data"
        novalidate>

        <div class="card-body">

            <!-- =========================
                 Message
            ========================== -->
            <div
                *ngIf="isMessage"
                class="alert alert-danger">

                {{ message }}

            </div>


            <!-- =========================
                 Title / Subtitle
            ========================== -->
            <div class="row">

                <!-- Title -->
                <div class="col-md-6 mb-3">

                    <label for="title">
                        Title
                        <span class="text-danger">*</span>
                    </label>

                    <input
                        id="title"
                        type="text"
                        class="form-control"
                        name="title"
                        [(ngModel)]="about.title"
                        #title="ngModel"
                        required>

                    <small
                        class="text-danger"
                        *ngIf="
                            aboutForm.submitted &&
                            title.invalid
                        ">

                        Title is required

                    </small>

                </div>


                <!-- Subtitle -->
                <div class="col-md-6 mb-3">

                    <label for="sub_title">
                        Sub Title
                    </label>

                    <input
                        id="sub_title"
                        type="text"
                        class="form-control"
                        name="sub_title"
                        [(ngModel)]="about.sub_title">

                </div>

            </div>


            <!-- =========================
                 Description
            ========================== -->
            <div class="row">

                <div class="col-md-12 mb-3">

                    <label for="description">

                        Description
                        <span class="text-danger">*</span>

                    </label>


                    <ckeditor
                        name="description"
                        [editor]="Editor"
                        [(ngModel)]="about.description"
                        [config]="editorConfig"
                        #description="ngModel"
                        required>
                    </ckeditor>


                    <small
                        class="text-danger"
                        *ngIf="
                            aboutForm.submitted &&
                            description.invalid
                        ">

                        Description is required

                    </small>

                </div>

            </div>


            <!-- =========================
                 Vision / Mission
            ========================== -->

            <!--
            <div class="row">

                <div class="col-md-6 mb-3">

                    <label for="vision">
                        Vision
                    </label>

                    <textarea
                        id="vision"
                        rows="5"
                        class="form-control"
                        name="vision"
                        [(ngModel)]="about.vision">
                    </textarea>

                </div>


                <div class="col-md-6 mb-3">

                    <label for="mission">
                        Mission
                    </label>

                    <textarea
                        id="mission"
                        rows="5"
                        class="form-control"
                        name="mission"
                        [(ngModel)]="about.mission">
                    </textarea>

                </div>

            </div>
            -->


            <!-- =========================
                 Chairman Message
            ========================== -->

            <!--
            <div class="row">

                <div class="col-md-12 mb-3">

                    <label for="chairman_message">
                        Chairman Message
                    </label>

                    <textarea
                        id="chairman_message"
                        rows="6"
                        class="form-control"
                        name="chairman_message"
                        [(ngModel)]="about.chairman_message">
                    </textarea>

                </div>

            </div>
            -->


            <!-- =========================
                 Images
            ========================== -->
            <div class="row">


                <!-- =========================
                     Image
                ========================== -->
                <div class="col-md-6 mb-3">

                    <label for="image">
                        About Image
                    </label>


                    <input
                        #fileInput
                        id="image"
                        type="file"
                        class="form-control"
                        accept="image/*"
                        (change)="
                            onFileChange(
                                $event,
                                'image'
                            )
                        ">


                    <!-- Image Preview -->
                    <div
                        *ngIf="imagePreview"
                        class="mt-3">

                        <label>
                            Preview
                        </label>

                        <div>

                            <img
                                [src]="imagePreview"
                                alt="About Us Image"
                                class="img-thumbnail"
                                style="
                                    width: 250px;
                                    height: 180px;
                                    object-fit: cover;
                                ">

                        </div>

                    </div>

                </div>


                <!-- =========================
                     Image 1
                ========================== -->
                <div class="col-md-6 mb-3">

                    <label for="image1">
                        Upload Image
                    </label>


                    <input
                        #fileInput1
                        id="image1"
                        type="file"
                        class="form-control"
                        accept="image/*"
                        (change)="
                            onFileChange(
                                $event,
                                'image1'
                            )
                        ">


                    <!-- Image 1 Preview -->
                    <div
                        *ngIf="image1Preview"
                        class="mt-3">

                        <label>
                            Preview
                        </label>

                        <div>

                            <img
                                [src]="image1Preview"
                                alt="About Us Image 1"
                                class="img-thumbnail"
                                style="
                                    width: 250px;
                                    height: 180px;
                                    object-fit: cover;
                                ">

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             Footer
        ========================== -->
        <div class="card-footer">

            <!-- Save / Update -->
            <button
                type="submit"
                class="btn btn-primary mr-2"
                [disabled]="loading">

                <span *ngIf="loading">
                    Saving...
                </span>

                <span *ngIf="!loading">

                    {{ about.id ? 'Update' : 'Save' }}

                </span>

            </button>


            <!-- Back -->
            <button
                type="button"
                class="btn btn-dark"
                (click)="handleBackBtn()">

                Back

            </button>

        </div>

    </form>

</div>
