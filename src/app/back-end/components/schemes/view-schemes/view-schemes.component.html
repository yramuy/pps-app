<!-- Loader -->
<div class="loader-overlay" *ngIf="isLoading">
  <div class="loader" role="status" aria-label="Loading"></div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title text-white">All Schemes</h3>
      </div>

      <!-- <div id="pageLoader" *ngIf="loader.loading$ | async">
        <div class="spinner-border text-primary"></div>
      </div> -->

      <div class="card-body">
        <!-- ================= FILTERS ================= -->
        <div class="row mb-3">
          <!-- Post Date -->
          <div class="col-md-4 mb-2">
            <label class="form-label">Post Date</label>

            <input
              type="date"
              class="form-control"
              [(ngModel)]="postDate"
              (ngModelChange)="onFilterChange()"
            />
          </div>

          <!-- Scheme Type -->
          <div class="col-md-4 mb-2">
            <label class="form-label">Scheme Type</label>

            <select
              class="form-control"
              [(ngModel)]="schemeType"
              (ngModelChange)="onFilterChange()"
            >
              <option value="">All Scheme Types</option>

              <option value="state">State Government Schemes</option>

              <option value="central">Central Government Schemes</option>
            </select>
          </div>

          <!-- Clear -->
          <div class="col-md-4 mb-2 d-flex align-items-end">
            <button
              type="button"
              class="btn btn-secondary"
              (click)="clearFilters()"
            >
              <i class="fas fa-sync"></i>
              Clear
            </button>
          </div>
        </div>

        <!-- ================= TABLE ================= -->
        <div class="table-responsive">
          <table id="mySchemesTable" class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>Sno</th>
                <th>Post Date</th>
                <th>Scheme Type</th>
                <th>Scheme Title</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let scheme of mySchemes(); let i = index">
                <td>{{ i + 1 }}</td>

                <td>
                  {{ scheme.post_date | date: "dd-MM-yyyy" }}
                </td>

                <td>
                  {{ scheme.scheme_type_name }}
                </td>

                <td class="description-cell">
                  {{ scheme.scheme_title }}
                </td>

                <td class="description-cell">
                  {{ scheme.scheme_description }}
                </td>

                <td>
                  <div class="action-buttons">
                    <!-- Edit -->
                    <button
                      type="button"
                      class="btn btn-success btn-sm"
                      (click)="handleEdit(scheme)"
                      title="Edit"
                    >
                      <i class="fas fa-edit"></i>
                    </button>

                    <!-- Delete -->
                    <button
                      type="button"
                      class="btn btn-danger btn-sm"
                      (click)="confirmDelete(scheme.id)"
                      title="Delete"
                    >
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>

              <tr *ngIf="mySchemes().length === 0">
                <td colspan="6" class="text-center">No Schemes found</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
