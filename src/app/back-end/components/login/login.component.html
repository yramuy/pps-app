<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PPS Login</title>

    <!-- AdminLTE + Icons -->
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" />
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .main-container {
      display: flex;
      height: 100vh;
    }

    /* LEFT SIDE (LOGO AREA) */
    .left-panel {
      width: 50%;
      background: linear-gradient(135deg, #cccfd1, #dee1c5);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    .left-panel img {
      width: 150px;
      margin-bottom: 20px;
    }

    .left-panel h1 {
      font-size: 32px;
      font-weight: bold;
    }

    /* RIGHT SIDE (LOGIN) */
    .right-panel {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f9;
    }

    .login-box {
      width: 500px;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      border: none;
      padding: 40px;
    }

    .card-body {
      padding: 80px 30px;
    }

    .login-box-msg {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-control {
      border-radius: 8px;
      border: 1px solid #ccc;
      height: 45px;
      padding-right: 40px;
    }

    .input-group-text {
      background: #f1f1f1;
      border: 1px solid #ccc;
      border-left: none;
    }

    .input-group .form-control {
      border-right: none;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-eye {
      position: absolute;
      right: 45px;
      top: 12px;
      cursor: pointer;
      color: #777;
      z-index: 10;
    }

    .btn-primary {
      border-radius: 8px;
      height: 45px;
      font-weight: 600;
    }

    .remember-label {
      font-size: 14px;
      margin-left: 5px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .left-panel {
        width: 100%;
        height: 30%;
      }

      .right-panel {
        width: 100%;
        height: 70%;
      }
    }
  </style>
  </head>

  <body>

    <div class="main-container">

      <!-- LEFT SIDE -->
      <div class="left-panel">
        <img src="assets/images/pps-main-logo@2x.png" alt="App Logo">
        <!-- change logo path -->
        <h1>PPS Application</h1>
        <p>Welcome to the system</p>
      </div>

      <!-- RIGHT SIDE -->
      <div class="right-panel">
        <div class="login-box">

          <div class="card">
            <div class="card-body">

              <p class="login-box-msg">Sign in to your account</p>

              <form (ngSubmit)="login()">

                <!-- Username -->
                <div class="input-group mb-4">
                  <input type="text" class="form-control" placeholder="Username"
                    [(ngModel)]="username" name="username" required>
                  <div class="input-group-append">
                    <div class="input-group-text">
                      <i class="fas fa-user"></i>
                    </div>
                  </div>
                </div>

                <!-- Password -->
                <div class="input-group mb-4 password-wrapper">
                  <input [type]="showPassword ? 'text' : 'password'"
                    class="form-control"
                    placeholder="Password"
                    [(ngModel)]="password"
                    name="password"
                    required>

                  <i class="fas"
                    [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
                    (click)="togglePassword()"
                    class="toggle-eye"></i>

                  <div class="input-group-append">
                    <div class="input-group-text">
                      <i class="fas fa-lock"></i>
                    </div>
                  </div>
                </div>

                <!-- Remember + Login -->
                <div class="row">
                  <div class="col-6 d-flex align-items-center">
                    <input type="checkbox" id="remember">
                    <label for="remember" class="remember-label">
                      Remember
                    </label>
                  </div>

                  <div class="col-6">
                    <button
                      type="submit"
                      class="btn btn-primary btn-block"
                      [disabled]="loading">

                      <span *ngIf="loading">
                        <i class="fas fa-spinner fa-spin mr-2"></i>
                        Logging in...
                      </span>

                      <span *ngIf="!loading">
                        Login
                      </span>

                    </button>
                  </div>
                </div>

                <!-- Go To Website -->
                <div class="text-center mt-4">
                  <a
                    rel="noopener noreferrer"
                    class="go-to-website"
                    (click)="goToWebsite()">
                    <i class="fas fa-globe mr-2"></i>
                    Go to Website
                  </a>
                </div>

              </form>

            </div>
          </div>

        </div>
      </div>

    </div>

  </body>
</html>
