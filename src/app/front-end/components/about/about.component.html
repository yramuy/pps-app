<!-- Loader -->
<div class="loader-overlay" *ngIf="isLoading">
  <div class="loader" role="status" aria-label="Loading"></div>
</div>

<!-- =========================
     ABOUT PAGE HEADER
========================= -->
<div class="main-bg">
  <div class="container">
    <div class="pt-lg-3 pt-5 pb-lg-0 pb-3">
      <div class="row align-items-center justify-content-center text-center">
        <div class="col-lg-10">
          <div class="pt-lg-5 pb-lg-3 pt-2 pb-2">

            <div class="row pt-3 justify-content-center">
              <div class="col-lg-10 p-3 rounded-20">

                <h1 class="display-3 fw-bold text-white mb-3">
                  About Us
                </h1>

                <p class="text-white mb-0">
                  We are committed to creating meaningful opportunities,
                  empowering communities, and contributing towards a better
                  future through dedicated service and development.
                </p>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- =========================
     ABOUT CONTENT
========================= -->
<div *ngIf="!loading()">

  <!-- =========================
       ABOUT INTRO
  ========================= -->
  <section class="about-intro py-3">
    <div class="container">

      <div class="row align-items-center justify-content-between g-4">

        <!-- TITLE -->
        <div class="col-lg-6">

          <div class="about-intro-title">
            <h2>
              {{ aboutUs.sub_title }}
            </h2>
          </div>

        </div>

        <!-- DESCRIPTION -->
        <div class="col-lg-5">

          <div
            class="rich-text"
            [innerHTML]="aboutUs.description">
          </div>

        </div>

      </div>

    </div>
  </section>


  <!-- =========================
       ABOUT CONTENT
  ========================= -->
  <section class="about-details py-3">
    <div class="container">

      <div class="row g-4 align-items-start">

        <!-- LEFT COLUMN -->
        <div class="col-lg-8">

          <!-- CHAIRMAN MESSAGE -->
          <div class="chairman-message mb-4">

            <div
              class="rich-text"
              [innerHTML]="aboutUs.chairman_message">
            </div>

          </div>


          <!-- IMAGE + VISION/MISSION -->
          <div class="row g-4 align-items-start">

            <!-- IMAGE -->
            <div class="col-md-6">

              <div class="about-image-card">

                <img
                  [src]="aboutUs.image || 'assets/images/about-us-02.webp'"
                  alt="About Us"
                  class="img-fluid zoom">

              </div>

            </div>


            <!-- VISION + MISSION -->
            <div class="col-md-6">

              <!-- VISION -->
              <div class="about-info-block">

                <h3 class="about-info-title">
                  OUR VISION
                </h3>

                <div
                  class="rich-text"
                  [innerHTML]="aboutUs.vision">
                </div>

              </div>


              <!-- MISSION -->
              <div class="about-info-block mt-4">

                <h3 class="about-info-title">
                  OUR MISSION
                </h3>

                <div
                  class="rich-text"
                  [innerHTML]="aboutUs.mission">
                </div>

              </div>

            </div>

          </div>

        </div>


        <!-- RIGHT COLUMN -->
        <div class="col-lg-4">

          <div class="about-aim">

            <!-- IMAGE -->
            <div class="about-aim-image">

              <img
                [src]="aboutUs.image1 || 'assets/images/about-us-01.webp'"
                alt="Our Aim"
                class="img-fluid zoom">

            </div>


            <!-- AIM -->
            <div class="about-info-block mt-4">

              <h3 class="about-info-title">
                OUR AIM
              </h3>

              <div
                class="rich-text"
                [innerHTML]="aboutUs.aim">
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>
  </section>

</div>
