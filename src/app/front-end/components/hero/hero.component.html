<div class="main-bg">

  <!-- Loader Overlay -->
  <div class="hero-loading-overlay" *ngIf="loading">
    <div class="hero-loader-content">
      <div class="spinner-border" role="status"></div>
      <p class="mt-3 mb-0">Loading...</p>
    </div>
  </div>

  <div class="container">
    <div class="pt-lg-3 pt-5 pb-lg-3 pb-3">
      <div class="row align-items-center justify-content-end">

        <div class="col-lg-6">
          <div class="ads-slider" id="adsSlider">
            <!-- Previous Button -->
            <button
              type="button"
              class="nav-btn prev"
              (click)="prevSlide()"
              [disabled]="loading || advertisements.length <= visibleItems()"
            >
              &#10094;
            </button>

            <div class="slider-track"
            #sliderTrack>
              <div class="ad-item" *ngFor="let advertisement of advertisements">
                <div class="ad-box">
                  <img [src]="advertisement.imageUrl" alt />
                </div>
              </div>

            </div>
            <!-- Next Button -->
            <button
              type="button"
              class="nav-btn next"
              (click)="nextSlide()"
              [disabled]="loading || advertisements.length <= visibleItems()"
            >
              &#10095;
            </button>
          </div>

          <!-- No Advertisement -->
          <div
            class="no-advertisement"
            *ngIf="!loading && advertisements.length === 0"
          >
            <p class="mb-0">No advertisements available.</p>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="pt-lg-5 pb-lg-3 pt-2 pb-2">
            <div class="row pt-3">
              <div class="col-lg-11 p-3 rounded-20">
                <h1 class="display-4 fw-bold text-white">
                  Sustainable Farming for a Thriving Future
                </h1>
                <p class="text-white">
                  We empower farmers with sustainable practices, quality seeds,
                  and modern technologies to cultivate abundant harvests,
                  support communities, protect resources, and ensure global food
                  security.
                </p>

                <button class="btn theme-btn">Explore More Jobs</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="about" class="pt-4"></div>
