<!-- Loader -->
<div class="loader-overlay" *ngIf="isLoading">
  <div class="loader" role="status" aria-label="Loading"></div>
</div>

<!-- Page Content -->
<div *ngIf="!loading">
  <!-- Page Header Start -->
  <div class="inner-bg">
    <div class="container">
      <div class="row align-items-start justify-content-center">
        <div class="col-lg-5">
          <img
            [src]="scheme_images.img_url"
            class="img-fluid rounded-20"
            alt="Scheme Image"
          />
        </div>

        <div class="col-lg-7">
          <div class="pt-2 pb-2">
            <div class="row pt-3">
              <div class="col-lg-12 p-3 rounded-20">
                <p class="mb-1 fw-bold fs-4 text-white">
                  Scheme Type :
                  {{ schemeData.scheme_type_name }}
                </p>

                <h1 class="display-4 fw-bold text-white pb-3">
                  {{ schemeData.scheme_title }}
                </h1>

                <p class="rounded-20 d-inline border py-1 px-3 text-white">
                  Posted Date : {{ schemeData.post_date }}
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Banner section end -->

  <section class="p-4">
    <div class="container">
      <div
        class="row align-items-center justify-content-center p-4 shadow rounded-20"
      >
        <div class="col-lg-12">
          <h2 class="fs-3 text-lowrcase">Introduction</h2>

          <p>
            {{ schemeData.scheme_description }}
          </p>
        </div>
      </div>

      <hr />

      <div class="row justify-content-between pt-3 align-items-center">
        <div class="col-auto">
          <div class="row">
            <div class="col-sm-12 col-lg-auto my-2">
              <b class="fs-4">Vote :</b>
            </div>

            <div class="col-sm-6 col-lg-auto my-2">
              <div class="d-flex border rounded px-3 py-1">
                <img
                  src="assets/images/diamond-icon.png"
                  width="25"
                  height="25"
                  alt="Diamond"
                />
                <p class="mb-0 px-2">130000</p>
              </div>
            </div>

            <div class="col-sm-6 col-lg-auto my-2">
              <div class="d-flex border rounded px-3 py-1">
                <img
                  src="assets/images/gold-icon.png"
                  width="25"
                  height="25"
                  alt="Gold"
                />
                <p class="mb-0 px-2">30000</p>
              </div>
            </div>

            <div class="col-sm-6 col-lg-auto my-2">
              <div class="d-flex border rounded px-3 py-1">
                <div class="d-flex border rounded px-3 py-1">
                  <img
                    src="assets/images/silver-icon.png"
                    width="25"
                    height="25"
                    alt="Silver"
                  />
                  <p class="mb-0 px-2">10000</p>
                </div>
              </div>
            </div>

            <div class="col-sm-6 col-lg-auto my-2">
              <div class="d-flex border rounded px-3 py-1">
                <img
                  src="assets/images/basic-icon.png"
                  width="25"
                  height="25"
                  alt="Basic"
                />
                <p class="mb-0 px-2">0</p>
              </div>
            </div>
          </div>
        </div>

        <div class="col-auto">
          <div class="entry-tags-list">
            <strong>Share:</strong>

            <a href="#">
              <img src="assets/images/facebook.svg" width="15" alt="Facebook" />
            </a>

            <a href="#">
              <img src="assets/images/twitter.svg" width="15" alt="Twitter" />
            </a>

            <a href="#">
              <img
                src="assets/images/instagram.svg"
                width="15"
                alt="Instagram"
              />
            </a>

            <a href="#">
              <img src="assets/images/linkedin.svg" width="15" alt="LinkedIn" />
            </a>
          </div>
        </div>
      </div>

      <hr />
    </div>

    <div class="container mt-4">
      <div class="row justify-content-center align-items-center">
        <div class="col-auto text-center bg-light rounded-20 border px-5 py-2">
          <ol class="breadcrumb mb-2">
            <li class="breadcrumb-item">
              <a href="#">Home</a>
            </li>

            <li class="breadcrumb-item active">About</li>
          </ol>
        </div>
      </div>
    </div>
  </section>
</div>
