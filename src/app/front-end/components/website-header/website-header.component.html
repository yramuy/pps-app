<!-- Header -->
<header id="header" [class.scrolled]="isScrolled">

  <div class="container">

    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="goHome()">
      <p class="fs-5 d-flex align-items-center mb-0 fw-bold text-white">
        <img
          src="assets/images/pps-main-logo.png"
          alt="Logo"
          width="80"
          class="me-2" />
      </p>
    </a>

    <!-- Navigation -->
    <nav id="desktopNav" [class.active]="isMenuOpen">

      <a
        href="javascript:void(0)"
        [class.active]="activeSection === 'home'"
        (click)="navigateToSection('home')">
        Home
      </a>

      <a
        href="javascript:void(0)"
        [class.active]="activeSection === 'about'"
        (click)="navigateToSection('about')">
        About Us
      </a>

      <a
        href="javascript:void(0)"
        [class.active]="activeSection === 'schemes'"
        (click)="navigateToSection('schemes')">
        Schemes
      </a>

      <a
        href="javascript:void(0)"
        [class.active]="activeSection === 'issues'"
        (click)="navigateToSection('issues')">
        Issues
      </a>

      <a
        href="javascript:void(0)"
        [class.active]="activeSection === 'vip-profiles'"
        (click)="navigateToSection('vip-profiles')">
        VIP Profiles
      </a>

      <a
        href="javascript:void(0)"
        [class.active]="activeSection === 'contact-us'"
        (click)="navigateToSection('contact')">
        Contact Us
      </a>

      <a
        routerLink="/admin/login"
        class="button-login px-3 py-2"
        (click)="closeMenu()">
        Login
      </a>

    </nav>

    <!-- Mobile Menu -->
    <button
      class="menu-btn"
      type="button"
      (click)="toggleMenu()">

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>

</header>
