<header id="header" [class.scrolled]="isScrolled">
  <div class="container">
    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img src="assets/images/pps-main-logo.png" alt="PPS Logo" width="80" />
    </a>

    <!-- Navigation -->
    <nav id="desktopNav" [class.active]="isMenuOpen">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </a>

      <a routerLink="/issues" routerLinkActive="active" (click)="closeMenu()">
        Issues
      </a>

      <a routerLink="/schemes" routerLinkActive="active" (click)="closeMenu()">
        Schemes
      </a>

      <a
        routerLink="/vip-profiles"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        VIP Profiles
      </a>

      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">
        About Us
      </a>

      <a
        routerLink="/contact-us"
        routerLinkActive="active"
        (click)="closeMenu()"
      >
        Contact Us
      </a>

      <a
        href="javascript:void(0)"
        class="button-login px-3 py-2"
        (click)="handleLoginClick()"
      >
        {{ isLogin }}
      </a>

    </nav>

    <!-- Mobile Menu -->
    <button
      class="menu-btn"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
